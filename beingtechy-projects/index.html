<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beingtechy — Projects</title>
  <meta name="description" content="Everything built at Beingtechy — live web apps, free and paid." />
  <meta property="og:title" content="Beingtechy — Projects" />
  <meta property="og:description" content="Everything built at Beingtechy — live web apps, free and paid." />
  <meta name="theme-color" content="#17150f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2317150f'/><text x='16' y='21' font-family='monospace' font-size='14' font-weight='700' fill='%23f3efe6' text-anchor='middle'>bt</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://s0.wp.com" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .hero { padding: 36px 0 28px; display: grid; gap: 28px; grid-template-columns: 1fr; align-items: end; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); }
    .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--free); box-shadow: 0 0 0 4px var(--free-bg); }
    .hero h1 {
      margin: 14px 0 0; font-size: clamp(44px, 9vw, 104px); line-height: .92; letter-spacing: -0.045em;
      font-weight: 800; font-variation-settings: "opsz" 96;
    }
    .hero h1 em { font-style: normal; color: var(--accent); }
    .hero p { margin: 18px 0 0; max-width: 46ch; color: var(--ink-2); font-size: 18px; }
    .stats { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); }
    .stat { flex: 1; padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; }
    .stat:first-child { border-left: 0; }
    .stat b { display: block; font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; }
    .stat span { color: var(--ink-3); }
    @media (min-width: 880px) { .hero { grid-template-columns: 1.6fr 1fr; padding-top: 56px; } }

    .toolbar {
      position: sticky; top: 0; z-index: 5; padding: 12px 0; margin-bottom: 8px;
      background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px);
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
      cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px;
    }
    .chip small { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
    .search { position: relative; flex: 1 1 220px; max-width: 320px; }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); }
    .search .input { padding-left: 34px; height: 38px; border-radius: 999px; font-size: 14px; }
    @media (max-width: 560px) { .search { max-width: none; flex-basis: 100%; } }

    .grid { display: grid; gap: 22px; grid-template-columns: 1fr; padding: 22px 0 64px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      display: flex; flex-direction: column; gap: 14px; padding: 12px; border-radius: 18px; background: var(--card);
      border: 1px solid var(--line); text-decoration: none; box-shadow: var(--shadow);
      transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .2s; min-width: 0;
      animation: rise .5s both cubic-bezier(.2,.7,.2,1);
    }
    .card:hover { transform: translateY(-4px); border-color: var(--ink-3); }
    .card:hover .shot img.ready { transform: scale(1.035); }
    .card-body { padding: 2px 6px 6px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card h2 { margin: 0; font-size: 22px; letter-spacing: -0.025em; line-height: 1.15; }
    .card p { margin: 0; color: var(--ink-2); font-size: 15px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px dashed var(--line); padding: 3px 8px; border-radius: 6px; }
    .card-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .visit { font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .visit svg { width: 15px; height: 15px; transition: transform .2s; }
    .card:hover .visit svg { transform: translate(2px, -2px); }
    .featured-tag { color: var(--accent); }

    @media (min-width: 980px) {
      .card.featured { grid-column: span 2; flex-direction: row; align-items: stretch; }
      .card.featured .frame { flex: 1.35; }
      .card.featured .card-body { flex: 1; padding: 12px 10px 6px; }
      .card.featured h2 { font-size: 30px; }
      .card.featured .shot { aspect-ratio: auto; height: calc(100% - 28px); min-height: 280px; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; border: 1px dashed var(--line); border-radius: 18px; color: var(--ink-3); }
    .skeleton { height: 360px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); }

    footer { border-top: 1px solid var(--line); padding: 26px 0 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ink-3); font-size: 14px; }
    footer a { text-decoration: none; color: var(--ink-2); font-weight: 600; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">bt</span> Beingtechy</a>
      <button class="icon-btn" id="theme" type="button"></button>
    </header>

    <section class="hero">
      <div>
        <span class="eyebrow mono"><span class="dot"></span> LIVE PROJECTS</span>
        <h1>Things I've<br />built<em>.</em></h1>
        <p>Web apps from the Beingtechy workshop — open any of them and start using it right away.</p>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat"><b id="s-total">–</b><span class="mono">projects</span></div>
        <div class="stat"><b id="s-free">–</b><span class="mono">free</span></div>
        <div class="stat"><b id="s-paid">–</b><span class="mono">paid</span></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filter by pricing"></div>
      <label class="search">
        <span class="sr-only">Search projects</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Search projects…" autocomplete="off" />
      </label>
    </div>

    <main class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </main>

    <footer>
      <span>© <span id="yr"></span> Beingtechy</span>
      <a href="https://buymeacoffee.com/ahamedjishfaan" target="_blank" rel="noopener">☕ Buy me a coffee</a>
    </footer>
  </div>

  <script type="module">
    import { frameHTML, loadThumb, initTheme, esc, pricingLabel, hostOf } from "/assets/common.js";

    initTheme(document.getElementById("theme"));
    document.getElementById("yr").textContent = new Date().getFullYear();

    const grid = document.getElementById("grid");
    const chips = document.getElementById("chips");
    const q = document.getElementById("q");
    let projects = [];
    let filter = "all";

    const FILTERS = [["all", "All"], ["free", "Free"], ["freemium", "Freemium"], ["paid", "Paid"]];
    const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

    function renderChips() {
      const count = (k) => (k === "all" ? projects.length : projects.filter((p) => p.pricing === k).length);
      chips.innerHTML = FILTERS.filter(([k]) => k === "all" || count(k) > 0)
        .map(([k, label]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${filter === k}">${label} <small>${count(k)}</small></button>`)
        .join("");
    }

    function render() {
      const term = q.value.trim().toLowerCase();
      const list = projects.filter((p) =>
        (filter === "all" || p.pricing === filter) &&
        (!term || [p.name, p.description, p.url, ...(p.tags || [])].join(" ").toLowerCase().includes(term))
      );
      if (!list.length) {
        grid.innerHTML = `<div class="empty">${projects.length ? "No projects match that search." : "No projects yet — check back soon."}</div>`;
        return;
      }
      grid.innerHTML = list.map((p, i) => `
        <a class="card ${p.featured && !term && filter === "all" ? "featured" : ""}" href="${esc(p.url)}" target="_blank" rel="noopener" data-id="${esc(p.id)}" style="animation-delay:${i * 60}ms">
          ${frameHTML(p)}
          <div class="card-body">
            <div class="card-head">
              <h2>${esc(p.name)}</h2>
              <span class="badge badge-${esc(p.pricing)}">${esc(pricingLabel(p))}</span>
            </div>
            ${p.description ? `<p>${esc(p.description)}</p>` : ""}
            ${p.tags?.length ? `<div class="tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
            <div class="card-foot">
              <span class="mono">${p.featured ? '<span class="featured-tag">★ featured</span>' : esc(hostOf(p.url))}</span>
              <span class="visit">Visit ${arrow}</span>
            </div>
          </div>
        </a>`).join("");
      grid.querySelectorAll(".card").forEach((el) => {
        const p = projects.find((x) => x.id === el.dataset.id);
        loadThumb(el.querySelector(".shot"), p);
      });
    }

    chips.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      filter = b.dataset.k;
      renderChips(); render();
    });
    q.addEventListener("input", render);

    try {
      const r = await fetch("/api/projects");
      const data = await r.json();
      projects = data.projects || [];
    } catch {
      grid.innerHTML = '<div class="empty">Couldn\'t load projects. Please refresh.</div>';
    }
    document.getElementById("s-total").textContent = String(projects.length).padStart(2, "0");
    document.getElementById("s-free").textContent = String(projects.filter((p) => p.pricing !== "paid").length).padStart(2, "0");
    document.getElementById("s-paid").textContent = String(projects.filter((p) => p.pricing !== "free").length).padStart(2, "0");
    if (projects.length) { renderChips(); render(); }
  </script>
</body>
</html>
